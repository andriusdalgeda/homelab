apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  timeout: 20m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        existingClaim: kube-prometheus-stack-grafana
        storageClassName: longhorn
        size: 2Gi
      service:
        type: ClusterIP

    prometheus:
      prometheusSpec:
        retention: 7d
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

    # The bundled Kubernetes dashboards select metrics by this label.  Add it at
    # scrape time so it is present on both raw metrics and recording rules.
    kubelet:
      serviceMonitor:
        relabelings:
          - targetLabel: cluster
            replacement: homelab
        cAdvisorRelabelings:
          - sourceLabels:
              - __metrics_path__
            targetLabel: metrics_path
          - targetLabel: cluster
            replacement: homelab
        probesRelabelings:
          - sourceLabels:
              - __metrics_path__
            targetLabel: metrics_path
          - targetLabel: cluster
            replacement: homelab

    kubeStateMetrics:
      prometheus:
        monitor:
          relabelings:
            - targetLabel: cluster
              replacement: homelab

    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - targetLabel: cluster
              replacement: homelab

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
