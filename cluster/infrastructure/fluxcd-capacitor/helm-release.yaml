---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/gimlet-io/capacitor-manifests
  ref:
    semver: ">=0.1.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capacitor
  namespace: flux-system
spec:
  targetNamespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: "./"
  sourceRef:
    kind: OCIRepository
    name: capacitor
  patches:
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: capacitor
          namespace: flux-system
        spec:
          template:
            spec:
              containers:
                - name: capacitor
                  env:
                    - name: AUTH
                      value: noauth
                    - name: IMPERSONATE_SA_RULES
                      value: noauth=flux-system:capacitor-next-preset-readonly
      target:
        kind: Deployment
        name: capacitor
        namespace: flux-system
