apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 10m
  chart:
    spec:
      chart: stirling-pdf
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: rubxkube
        namespace: flux-system
  install:
    createNamespace: true
  values:
    common:
      name: stirling-pdf
      service:
        enabled: true
        type: ClusterIP
        servicePort: 8080
      deployment:
        port: 8080
        podSecurityContext:
          fsGroup: 1000
        strategy:
          type: Recreate
      image:
        repository: ghcr.io/stirling-tools/stirling-pdf
        tag: 2.14.3
        pullPolicy: IfNotPresent
      variables:
        nonSecret:
          DOCKER_ENABLE_SECURITY: true
          SECURITY_ENABLELOGIN: true
          TZ: Europe/London
      startupProbeEnabled: true
      startupProbe:
        httpGet:
          path: /api/v1/info/status
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 30
      readinessProbeEnabled: true
      readinessProbe:
        httpGet:
          path: /api/v1/info/status
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 6
      livenessProbeEnabled: true
      livenessProbe:
        httpGet:
          path: /api/v1/info/status
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 6
      persistence:
        enabled: true
        volumes:
          - name: trainingdata
            storageClassName: longhorn
            size: 5Gi
            pvcClaim: ""
            containerMount: /usr/share/tessdata
          - name: config
            storageClassName: longhorn
            size: 1Gi
            pvcClaim: ""
            containerMount: /configs
          - name: log
            storageClassName: longhorn
            size: 1Gi
            pvcClaim: ""
            containerMount: /logs
      ingress:
        enabled: false
