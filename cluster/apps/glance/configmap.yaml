apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    server:
      proxied: true

    branding:
      app-name: Home
      logo-text: H
      hide-footer: true

    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Europe/London
                    label: London
              - type: weather
                location: London, United Kingdom
                units: metric
                hour-format: 24h

          - size: full
            widgets:
              - type: bookmarks
                groups:
                  - title: Homelab
                    links:
                      - title: Obsidian
                        url: https://obsidian.andriusdalgeda.com
                        icon: si:obsidian
                      - title: Grafana
                        url: https://grafana.andriusdalgeda.com
                        icon: si:grafana
                      - title: Flux
                        url: https://flux.andriusdalgeda.com
                        icon: si:flux
                  - title: Media
                    links:
                      - title: Audiobookshelf
                        url: https://abs.andriusdalgeda.com
                        icon: si:audiobookshelf
                      - title: Seerr
                        url: https://seerr.andriusdalgeda.com
                        icon: si:overseerr
              - type: custom-api
                title: Uptime Kuma
                title-url: https://status.andriusdalgeda.com
                url: https://status.andriusdalgeda.com/api/status-page/status
                subrequests:
                  heartbeats:
                    url: https://status.andriusdalgeda.com/api/status-page/heartbeat/status
                cache: 10m
                template: |
                  {{ $hb := .Subrequest "heartbeats" }}

                  {{ if not (.JSON.Exists "publicGroupList") }}
                  <p class="color-negative">Error reading response</p>
                  {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
                  <p>No monitors found</p>
                  {{ else }}

                  <ul class="dynamic-columns list-gap-8">
                    {{ range .JSON.Array "publicGroupList" }}
                    {{ range .Array "monitorList" }}
                    {{ $id := .String "id" }}
                    {{ $hbArray := $hb.JSON.Array (print "heartbeatList." $id) }}
                    <div class="flex items-center gap-12">
                      <a class="size-title-dynamic color-highlight text-truncate block grow" href="https://uptime.andriusdalgeda.com/dashboard/{{ $id }}"
                        target="_blank" rel="noreferrer">
                        {{ .String "name" }} </a>

                      {{ if gt (len $hbArray) 0 }}
                        {{ $latest := index $hbArray (sub (len $hbArray) 1) }}
                        {{ if eq ($latest.Int "status") 1 }}
                        <div>{{ $latest.Int "ping" }}ms</div>
                        <div class="monitor-site-status-icon-compact" title="OK">
                          <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                              d="M10 18a8 8 0 1 0 0-16 8 8 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 0 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                              clip-rule="evenodd"></path>
                          </svg>
                        </div>
                        {{ else }}
                        <div><span class="color-negative">DOWN</span></div>
                        <div class="monitor-site-status-icon-compact" title="{{ if $latest.Exists "msg" }}{{ $latest.String "msg" }}{{ else
                          }}Error{{ end }}">
                          <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                              d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm.75 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"
                              clip-rule="evenodd"></path>
                          </svg>
                        </div>
                        {{ end }}
                      {{ else }}
                        <div><span class="color-negative">No data</span></div>
                        <div class="monitor-site-status-icon-compact" title="No data available">
                          <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-2a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm-.75-8a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V8zm.75 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                          </svg>
                        </div>
                      {{ end }}
                    </div>
                    {{ end }}
                    {{ end }}
                  </ul>
                  {{ end }}

      - name: Work
        columns:
          - size: full
            widgets:
              - type: rss
                title: Platform updates
                limit: 20
                collapse-after: 10
                cache: 6h
                feeds:
                  - url: https://www.microsoft.com/releasecommunications/api/v2/azure/rss
                    title: Azure updates
                  - url: https://devblogs.microsoft.com/devops/feed/
                    title: Azure DevOps Blog
                  - url: https://kubernetes.io/feed.xml
                    title: Kubernetes Blog
