apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
    spec:
      containers:
        - name: linkwarden
          image: ghcr.io/linkwarden/linkwarden:v2.16.2
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: linkwarden-credentials
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@linkwarden-postgres:5432/postgres
            - name: MEILI_HOST
              value: http://linkwarden-meilisearch:7700
            - name: NEXTAUTH_URL
              value: https://linkwarden.andriusdalgeda.com/api/v1/auth
            - name: NEXT_PUBLIC_CREDENTIALS_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data/data
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkwarden-data
