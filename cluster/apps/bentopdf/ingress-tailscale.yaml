apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bentopdf-tailscale
  namespace: bentopdf
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - pdf
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bentopdf
                port:
                  number: 8080
